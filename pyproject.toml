[project]
name = "torchcurves"
dynamic = ["version"]
description = "PyTorch module for differentiable parametric curves with learnable coefficients"
authors = [
    { name = "Alex Shtoff", email = "alex.shtf@gmail.com" }
]
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.9"
keywords = [
    "pytorch",
    "b-spline",
    "bspline",
    "splines",
    "parametric-curves",
    "differentiable",
    "kan",
    "kolmogorov-arnold-networks",
    "legendre-polynomials",
    "function-approximation",
    "continuous-embeddings",
    "scientific-computing",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Scientific/Engineering :: Mathematics",
    "Topic :: Software Development :: Libraries :: Python Modules",
]

dependencies = [
    "torch>=2.2.0",
]

[dependency-groups]
dev = [
    "numpy>=1.17.0",
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "ruff>=0.1.0",
    "pyright>=1.1.351",
    "pre-commit>=3.0.0",
    "pytest-benchmark>=5.2.0",
    "scipy>=1.13.1",
]
doc = [
    "sphinx>=7.4.7",
    "myst-parser>=3.0.1",
    "sphinx-autodoc-typehints>=2.3.0",
    "sphinx-copybutton>=0.5.2",
    "sphinx-autobuild>=2024.10.3",
    "sphinxext-opengraph>=0.10.0",
    "pydata-sphinx-theme>=0.16.1",
    "ipython>=8.18.1",
    "nbsphinx>=0.9.7",
    "pandoc>=2.4",
]
examples = [
    "ipykernel>=6.29.0",
    "matplotlib>=3.8.0",
    "ipywidgets>=8.1.7",
    "kagglehub[pandas-datasets]>=0.3.12",
    "pandas>=2.3.0",
    "scikit-learn>=1.6.1",
    "scipy>=1.13.1",
]

[project.urls]
Homepage = "https://github.com/alexshtf/torchcurves"
Repository = "https://github.com/alexshtf/torchcurves"
Issues = "https://github.com/alexshtf/torchcurves/issues"
Documentation = "https://torchcurves.readthedocs.io/en/stable/"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/torchcurves"]

[tool.hatch.version]
path = "src/torchcurves/__init__.py"

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = [ "E", "W", "F", "I", "B", "C4", "N", "D", "SIM",]
extend-select = [ "RUF100",]
ignore = [ "E101", "D100", "D101", "D102", "D103", "D104", "D105", "D106", "D107", "B024",]
fixable = [ "ALL",]
