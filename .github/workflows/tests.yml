name: Tests

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.9", "3.10", "3.11", "3.12", "3.13"]
        torch-version: ["current"]
        include:
          - python-version: "3.12"
            torch-version: "2.2.0"

    steps:
    - uses: actions/checkout@v4

    - name: Install uv
      uses: astral-sh/setup-uv@v3

    - name: Set up Python ${{ matrix.python-version }}
      run: uv python install ${{ matrix.python-version }}

    - name: Install dependencies
      run: |
        uv venv --python ${{ matrix.python-version }}
        uv sync --all-groups

    - name: Install minimum supported PyTorch (CPU)
      if: matrix.torch-version == '2.2.0'
      run: |
        # PyTorch 2.2's NumPy bridge requires the NumPy 1.x binary ABI.
        uv pip install "numpy<2"
        uv pip install "torch==2.2.0" --index-url https://download.pytorch.org/whl/cpu

    - name: Lint with ruff
      run: |
        uv run --no-sync ruff check src/ tests/

    - name: Type check with pyright
      run: |
        uv run --no-sync pyright src/

    - name: Test with pytest
      run: |
        uv run --no-sync pytest tests/ -v --cov=torchcurves --cov-report=term-missing
